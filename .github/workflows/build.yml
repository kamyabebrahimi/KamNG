name: KamNG APK

on:
  workflow_dispatch:
  push:
    branches: [my-releases]
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/build.yml'
      - 'compile-*.sh'
      - 'fetch-psiphon-servers.sh'
      - '.gitmodules'
      - 'AndroidLibXrayLite'
      - 'hev-socks5-tunnel'
      - 'aether'

permissions:
  contents: write

concurrency:
  group: kamng-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The stable release aether's own release workflow built with; pinned so a new stable
      # release cannot change or break the release build on its own. Bump it together with
      # the aether submodule.
      RUST_TOOLCHAIN: "1.99.0"
      # The Go line the Psiphon client's go.mod asks for, which also covers lyrebird's older one;
      # aether/psiphon-build.sh and aether/pt-build.sh pin the programs themselves. Bump it when a
      # bumped aether submodule pins a program that asks for a newer line.
      GO_VERSION: "1.26"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    # KAMNG_BOOTSTRAP_START
    - name: Apply reviewed KamNG source patch
      run: |
        sed -i 's/\r$//' .github/workflows/kamng-source.patch
        git apply --check .github/workflows/kamng-source.patch
        git apply .github/workflows/kamng-source.patch
    # KAMNG_BOOTSTRAP_END

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        # The client is built from a checkout of its own; there is no go.sum here to cache by.
        cache: false

    # The Aether core runs Psiphon as a program of its own, the psiphon-tunnel-core console client,
    # which the app ships beside the core as libpsiphon-tunnel-core.so; see compile-psiphon.sh.
    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    # Tor's bridges run through a pluggable transport, a program of its own: lyrebird, which aether
    # builds and the app ships beside the core as liblyrebird.so; see compile-pt.sh.
    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    # Psiphon's client starts with the newest server list the build could fetch, so a fresh install has
    # servers before it can reach the list on its own; see fetch-psiphon-servers.sh.
    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Validate fork identity and presets
      run: python3 scripts/validate-kamng.py

    - name: Build and test KamNG
      working-directory: V2rayNG
      run: |
        printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
        chmod 755 gradlew
        ./gradlew --no-daemon :app:testPlaystoreDebugUnitTest :app:testFdroidDebugUnitTest :app:compilePlaystoreDebugKotlin :app:compileFdroidDebugKotlin
        ./gradlew --no-daemon :app:assemblePlaystoreDebug :app:assembleFdroidDebug -PkamngVersion=0.1.0

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: KamNG-test-reports
        path: |
          V2rayNG/app/build/reports/tests/
          V2rayNG/app/build/test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Verify APK native libraries
      run: python3 scripts/validate-kamng.py --apk

    - name: Upload installable test APKs
      uses: actions/upload-artifact@v7
      with:
        name: KamNG-debug-APKs
        path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Build summary
      run: |
        printf '%s\n' '### KamNG test build' 'Download **KamNG-debug-APKs** from this run’s Artifacts.' 'These are debug-signed test APKs. Release signing and device validation are still required.' >> "$GITHUB_STEP_SUMMARY"

    # KAMNG_PROMOTION_START
    - name: Save tested KamNG source to the fork
      run: |
        python3 - <<'PY'
        from pathlib import Path
        file = Path(".github/workflows/build.yml")
        content = file.read_text(encoding="utf-8")
        for start, end in [("    # KAMNG_BOOTSTRAP_START", "    # KAMNG_BOOTSTRAP_END"), ("    # KAMNG_PROMOTION_START", "    # KAMNG_PROMOTION_END")]:
            begin = content.index(start)
            finish = content.index(end, begin) + len(end)
            content = content[:begin] + content[finish:]
        file.write_text(content, encoding="utf-8")
        Path(".github/workflows/kamng-source.patch").unlink()
        PY
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- 'V2rayNG/app/build.gradle.kts' 'V2rayNG/app/src/dev/res/values/strings.xml' 'V2rayNG/app/src/fdroid/res/values/strings.xml' 'V2rayNG/app/src/main/res/values-ar/strings.xml' 'V2rayNG/app/src/main/res/values-bn/strings.xml' 'V2rayNG/app/src/main/res/values-bqi-rIR/strings.xml' 'V2rayNG/app/src/main/res/values-fa/strings.xml' 'V2rayNG/app/src/main/res/values-ru/strings.xml' 'V2rayNG/app/src/main/res/values-vi/strings.xml' 'V2rayNG/app/src/main/res/values-zh-rCN/strings.xml' 'V2rayNG/app/src/main/res/values-zh-rTW/strings.xml' 'V2rayNG/app/src/main/res/values/strings.xml' 'V2rayNG/app/src/pre_release/res/values/strings.xml' 'V2rayNG/app/src/main/res/xml/shortcuts.xml' 'V2rayNG/app/src/fdroid/res/xml/shortcuts.xml' 'V2rayNG/app/src/main/java/com/v2ray/ang/AppConfig.kt' 'V2rayNG/app/src/main/assets/custom_routing_white_iran' 'scripts/validate-kamng.py' 'V2rayNG/app/src/test/java/com/v2ray/ang/handler/KamNGPresetTest.kt' 'README.md' '.github/workflows/build.yml' '.github/workflows/kamng-source.patch'
        test -z "$(git diff --cached --name-only -- ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' ':(glob)**/GEMINI.md' .github/copilot-instructions.md)"
        git diff --cached --check
        git commit -m 'Apply tested KamNG identity and routing presets'
        git push origin HEAD:my-releases
    # KAMNG_PROMOTION_END
